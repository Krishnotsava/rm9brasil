<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Cliente | RM9Brasil</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/portal.css">
  
  <!-- Firebase SDKs (Compat version for browser script) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- 1. TELA DE LOGIN -->
  <div id="loginPage" class="portal-container">
    <div class="login-box glass-card">
      <div class="brand-header">
        <img src="../assets/logo.png" alt="RM9 Growth Partner" class="logo-rm9">
        <h1>Portal do Cliente</h1>
        <p>Acesse o painel de performance de suas campanhas em tempo real.</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail corporativo</label>
          <input type="email" id="email" placeholder="seuemail@empresa.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Senha de acesso</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <div id="loginError" class="error-message"></div>
        
        <button type="submit" id="btnLogin" class="btn btn-primary btn-full">
          <span>Acessar Dashboard</span>
          <div class="spinner btn-spinner"></div>
        </button>
      </form>
    </div>
  </div>

  <!-- 2. TELA DO DASHBOARD -->
  <div id="dashboardPage" class="dashboard-container" style="display: none;">
    <!-- HEADER DO PORTAL -->
    <header class="portal-header">
      <div class="header-left">
        <img src="../assets/logo.png" alt="RM9 Logo" class="header-logo-rm9">
        <div class="header-divider"></div>
        <span class="welcome-text">Painel de Performance</span>
      </div>
      
      <div class="header-right">
        <!-- Client Logo will be loaded dynamically here -->
        <img id="clientLogo" src="" alt="Logo do Cliente" class="header-logo-client" style="display: none;">
        <button id="btnLogout" class="btn btn-secondary btn-small">
          <span>Sair</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- CONTAINER DO DASHBOARD (IFRAME) -->
    <main class="dashboard-main">
      <!-- Loading screen inside dashboard while fetching Firestore data -->
      <div id="dashLoading" class="dash-loader">
        <div class="spinner main-spinner"></div>
        <p>Carregando relatórios em tempo real...</p>
      </div>
      
      <!-- Looker Studio IFrame -->
      <iframe id="iframeReport" src="" frameborder="0" style="display: none;" allowfullscreen></iframe>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/portal.js"></script>
</body>
</html>
